<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,900&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "action-orange": "#ff5722",
                    "tertiary-container": "#d2e5f5",
                    "outline-variant": "#444933",
                    "secondary": "#ffb5a0",
                    "on-background": "#e2e4cf",
                    "on-secondary": "#5f1500",
                    "surface-bright": "#373b2c",
                    "on-error-container": "#ffdad6",
                    "on-primary-container": "#556d00",
                    "secondary-container": "#d73b00",
                    "surface-container-lowest": "#0c0f04",
                    "error": "#ffb4ab",
                    "on-primary-fixed": "#161e00",
                    "on-tertiary-container": "#556774",
                    "surface-dim": "#111508",
                    "surface-tint": "#abd600",
                    "on-primary": "#283500",
                    "secondary-fixed-dim": "#ffb5a0",
                    "on-tertiary": "#21323e",
                    "on-error": "#690005",
                    "background": "#111508",
                    "on-tertiary-fixed-variant": "#374956",
                    "primary-fixed-dim": "#abd600",
                    "on-primary-fixed-variant": "#3c4d00",
                    "surface-container-high": "#282b1d",
                    "primary": "#ffffff",
                    "tertiary-fixed": "#d2e5f5",
                    "surface-container-highest": "#333627",
                    "on-secondary-container": "#fffbff",
                    "inverse-on-surface": "#2f3223",
                    "inverse-surface": "#e2e4cf",
                    "tertiary": "#ffffff",
                    "primary-fixed": "#c3f400",
                    "outline": "#8e9379",
                    "surface": "#111508",
                    "primary-container": "#c3f400",
                    "on-tertiary-fixed": "#0b1d29",
                    "inverse-primary": "#506600",
                    "surface-container-low": "#1a1d10",
                    "on-surface": "#e2e4cf",
                    "secondary-fixed": "#ffdbd1",
                    "on-surface-variant": "#c4c9ac",
                    "error-container": "#93000a",
                    "surface-container": "#1e2113",
                    "surface-variant": "#333627",
                    "tertiary-fixed-dim": "#b6c9d8",
                    "on-secondary-fixed": "#3b0900",
                    "on-secondary-fixed-variant": "#862200"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "xs": "4px",
                    "xl": "32px",
                    "gutter": "12px",
                    "unit": "4px",
                    "md": "16px",
                    "sm": "8px",
                    "margin-mobile": "16px",
                    "lg": "24px"
            },
            "fontFamily": {
                    "headline-lg": ["Barlow Condensed"],
                    "label-caps": ["JetBrains Mono"],
                    "metric-lg": ["Barlow Condensed"],
                    "metric-md": ["Barlow Condensed"],
                    "body-lg": ["Inter"],
                    "headline-md": ["Barlow Condensed"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "metric-lg": ["64px", {"lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "metric-md": ["48px", {"lineHeight": "48px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .breadcrumb-glow {
            filter: drop-shadow(0 0 4px #ff5722);
        }
        .metric-outline {
            text-shadow: -1px -1px 0 #111508, 1px -1px 0 #111508, -1px 1px 0 #111508, 1px 1px 0 #111508;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-hidden h-screen w-screen">
<!-- TopAppBar Mapping -->
<header class="flex justify-between items-center w-full px-margin-mobile h-16 bg-surface dark:bg-surface border-b border-outline-variant fixed top-0 left-0 z-50">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary-container dark:text-primary-container">gps_fixed</span>
<h1 class="font-headline-lg text-headline-lg text-primary-container italic font-black uppercase">STARVVING</h1>
</div>
</header>
<!-- Map Canvas (The Engine) -->
<main class="relative h-full w-full pt-16">
<!-- Mock Map Background -->
<div class="absolute inset-0 bg-surface-container-lowest overflow-hidden">
<img class="w-full h-full object-cover opacity-60 grayscale brightness-75" data-alt="A dark, high-contrast topographic satellite map of a rugged mountain terrain at night. The map shows detailed elevation contours in deep charcoal and black. A vibrant neon orange glowing line snakes through the valleys and ridges, representing a GPS tracking breadcrumb." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZpt1pHrfHhI0NL-cUnRUI6sVlp5pyIc-pohhM6VNudd_Z2oH-sFIL8jY7BupoezfhnP9HEK0pFyC9sEwCf7R1Qr26MZgKb7wDHHTBbvMLzmzdoTbw8Z-6B8hvCJWoHuU1XR8VuA5B6ZaIa5Tg9a65E5gnDmy29qO2FDL4tSIftHUXQ7Ssnz8KmhOdb0pYRvB2Td8eXxzP8Ijqjm0thKgTA9oARLf1BR_YYm7C3nBfq5il8nkt_gv994xViNxPFk7duuqV4ZxfM7cE"/>
<!-- Breadcrumb Path Overlay -->
<svg class="absolute inset-0 w-full h-full breadcrumb-glow" fill="none" viewbox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
<path d="M200 700L210 650L180 600L220 540L200 480L240 420L230 350L260 300L220 250" stroke="#ff5722" stroke-linecap="square" stroke-linejoin="bevel" stroke-width="4"></path>
<circle cx="220" cy="250" fill="#ff5722" r="6"></circle>
</svg>
</div>
<!-- Metric Overlay Container -->
<div class="absolute top-4 left-0 w-full px-margin-mobile flex flex-col gap-gutter z-20 pointer-events-none">
<!-- Modular Metric Grid -->
<div class="grid grid-cols-2 gap-gutter">
<div class="bg-surface/80 backdrop-blur-md border-l-4 border-primary-container p-md flex flex-col pointer-events-auto">
<span class="font-label-caps text-label-caps text-on-surface-variant">PACE (AVG)</span>
<div class="flex items-baseline gap-xs">
<span class="font-metric-md text-metric-md text-primary font-bold tabular-nums">05:42</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">/KM</span>
</div>
</div>
<div class="bg-surface/80 backdrop-blur-md border-l-4 border-primary-container p-md flex flex-col pointer-events-auto">
<span class="font-label-caps text-label-caps text-on-surface-variant">DURATION</span>
<span class="font-metric-md text-metric-md text-primary font-bold tabular-nums">24:15</span>
</div>
</div>
<div class="bg-surface/80 backdrop-blur-md border-l-4 border-primary-container p-md flex flex-col w-full pointer-events-auto">
<span class="font-label-caps text-label-caps text-on-surface-variant">DISTANCE</span>
<div class="flex items-baseline justify-between">
<div class="flex items-baseline gap-xs">
<span class="font-metric-lg text-metric-lg text-primary font-bold tabular-nums">4.2</span>
<span class="font-headline-md text-headline-md text-on-surface-variant">KM</span>
</div>
</div>
<!-- Custom GPS Progress Bar -->
<div class="w-full h-2 bg-surface-container-highest mt-sm">
<div class="h-full bg-primary-container breadcrumb-glow w-[42%]"></div>
</div>
</div>
</div>
<!-- Controls Section -->
<div class="absolute bottom-8 left-0 w-full px-margin-mobile flex flex-col gap-md z-30">
<!-- Active Lap Info (Subtle) -->
<div class="flex justify-center">
<div class="bg-surface-container-high/90 border border-outline-variant px-md py-1 rounded-full flex items-center gap-md">
<span class="font-label-caps text-label-caps text-on-surface-variant">CURRENT LAP 04</span>
<div class="w-1 h-1 bg-outline rounded-full"></div>
<span class="font-label-caps text-label-caps text-primary font-bold">01:12.4</span>
</div>
</div>
<!-- Primary Actions -->
<div class="grid grid-cols-2 gap-md">
<button class="h-16 bg-surface-container border-2 border-action-orange text-action-orange font-headline-md text-headline-md flex items-center justify-center gap-sm active:translate-y-0.5 transition-all rounded-lg uppercase">
<span class="material-symbols-outlined">timer</span>
                    LAP
                </button>
<button class="h-16 bg-action-orange/10 border-2 border-action-orange text-action-orange font-headline-md text-headline-md flex items-center justify-center gap-sm active:translate-y-0.5 transition-all rounded-lg uppercase">
<span class="material-symbols-outlined">stop_circle</span>
                    STOP
                </button>
</div>
</div>
</main>
</body></html>
